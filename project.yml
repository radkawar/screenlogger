name: Screenlog
options:
  bundleIdPrefix: dev.screenlog
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
# One shared xcconfig owns MARKETING_VERSION and CURRENT_PROJECT_VERSION for
# every Xcode target. SwiftPM bundles the same file for ScreenlogCore.version.
configFiles:
  Debug: Sources/ScreenlogCore/Resources/ProductVersion.xcconfig
  Release: Sources/ScreenlogCore/Resources/ProductVersion.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    DEAD_CODE_STRIPPING: "YES"
    # Xcode's legacy user-header search behavior emits the deprecated
    # "traditional headermap" warning and is unnecessary for this Swift project.
    ALWAYS_SEARCH_USER_PATHS: "NO"
  configs:
    Debug:
      # Preserve debugger/instrumentation behavior for local development.
      ENABLE_HARDENED_RUNTIME: "NO"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      # Required for Developer ID distribution and notarization.
      ENABLE_HARDENED_RUNTIME: "YES"
      # Never let local/ad-hoc Release builds gain debugger attachment rights.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
# Public Apple system frameworks required by Screenlogger's local capture,
# recognition, storage, and interface stack.
#
# Source roots under Sources/ (must stay in sync with disk):
#   ScreenlogCore/{Accessibility,Capture,Compaction,Deletion,Exclusions,Models,OCR,Permissions,Retention,Storage,XPC}
#   ScreenlogApp/{Views,Services}
#   ScreenlogCLI/
# Empty folders (e.g. Services/) are fine; XcodeGen skips empties.

targets:
  ScreenlogCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ScreenlogCore
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.core
        PRODUCT_NAME: ScreenlogCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # Critical: default is /Library/Frameworks/... which makes app/CLI crash at dyld load.
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_DYLIB_INSTALL_NAME: "@rpath/ScreenlogCore.framework/Versions/A/ScreenlogCore"
        INSTALL_PATH: "@rpath"
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libcompression.tbd
      - sdk: Accelerate.framework
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: Combine.framework
      - sdk: CoreAudio.framework
      - sdk: CoreData.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreServices.framework
      - sdk: CoreVideo.framework
      - sdk: CryptoKit.framework
      - sdk: DiskArbitration.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: IOKit.framework
      - sdk: MetricKit.framework
      - sdk: Network.framework
      - sdk: OSLog.framework
      - sdk: QuartzCore.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: SwiftUI.framework
      - sdk: VideoToolbox.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: Metal.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Accessibility.framework

  ScreenlogApp:
    type: application
    productName: Screenlogger
    platform: macOS
    sources:
      - path: Sources/ScreenlogApp
        createIntermediateGroups: true
      # A folder reference preserves the required distributed layout:
      # Contents/Resources/skill/screenlog-cli-skill/SKILL.md.
      # XcodeGen target resources must be declared as target sources with an
      # explicit resources build phase; a top-level `resources` key is ignored.
      - path: Resources/skill
        type: folder
        buildPhase: resources
      # Ship attribution beside the product marks that appear in Settings.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.app
        PRODUCT_NAME: Screenlogger
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Screenlog.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ScreenlogCore
        embed: true
        # The embed phase strips development headers, so the copied framework
        # must be re-signed to keep its resource seal valid.
        codeSign: true
      - package: Sparkle
      # The Settings "Install CLI" action must work from a distributed app,
      # not only from a developer checkout. This build-order dependency makes
      # the signed CLI available to the app's copy phase below.
      - target: ScreenlogCLI
        embed: false
        link: false
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libcompression.tbd
      - sdk: Accelerate.framework
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: AVFoundation.framework
      - sdk: Combine.framework
      - sdk: CoreAudio.framework
      - sdk: CoreData.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreServices.framework
      - sdk: CoreVideo.framework
      - sdk: CryptoKit.framework
      - sdk: DiskArbitration.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: IOKit.framework
      - sdk: MetricKit.framework
      - sdk: Network.framework
      - sdk: OSLog.framework
      - sdk: QuartzCore.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: SwiftUI.framework
      - sdk: VideoToolbox.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: Metal.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Accessibility.framework
    postBuildScripts:
      - name: Embed installable screenlog CLI
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/screenlog"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/screenlog"
        script: |
          set -euo pipefail
          install -m 755 \
            "${BUILT_PRODUCTS_DIR}/screenlog" \
            "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/MacOS/screenlog"

  ScreenlogCLI:
    type: tool
    productName: screenlog
    platform: macOS
    sources:
      - path: Sources/ScreenlogCLI
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.cli
        PRODUCT_NAME: screenlog
        # Find ScreenlogCore.framework next to the binary (copied post-build) and via @loader_path.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/../Frameworks @loader_path"
    dependencies:
      - target: ScreenlogCore
        embed: false
        link: true
      - sdk: libsqlite3.tbd
    postBuildScripts:
      - name: Embed ScreenlogCore + skill next to CLI
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/ScreenlogCore.framework/Versions/A/ScreenlogCore"
          - "$(BUILT_PRODUCTS_DIR)/ScreenlogCore.framework/Versions/A/Resources/Info.plist"
          - "$(SRCROOT)/Resources/skill/screenlog-cli-skill/SKILL.md"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/Frameworks/ScreenlogCore.framework/Versions/A/ScreenlogCore"
          - "$(BUILT_PRODUCTS_DIR)/Frameworks/ScreenlogCore.framework/Versions/A/Resources/Info.plist"
          - "$(BUILT_PRODUCTS_DIR)/skill/screenlog-cli-skill/SKILL.md"
        script: |
          set -euo pipefail
          FW_SRC="${BUILT_PRODUCTS_DIR}/ScreenlogCore.framework"
          # Framework already lives in BUILT_PRODUCTS_DIR; ensure install name is @rpath.
          # Copy into a Frameworks/ sibling for parity with app layout when distributing a zip.
          mkdir -p "${BUILT_PRODUCTS_DIR}/Frameworks"
          rsync -a --delete "${FW_SRC}/" "${BUILT_PRODUCTS_DIR}/Frameworks/ScreenlogCore.framework/"
          # Assistant skill next to CLI for `screenlog skill install` (also in app Resources).
          SKILL_SRC="${SRCROOT}/Resources/skill/screenlog-cli-skill"
          if [[ -f "${SKILL_SRC}/SKILL.md" ]]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/skill/screenlog-cli-skill"
            rsync -a --delete "${SKILL_SRC}/" "${BUILT_PRODUCTS_DIR}/skill/screenlog-cli-skill/"
            echo "CLI skill embed: skill/screenlog-cli-skill ready next to screenlog"
          fi
          echo "CLI rpath embed: Frameworks/ScreenlogCore.framework ready next to screenlog"

  ScreenlogCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ScreenlogCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.tests
        PRODUCT_NAME: ScreenlogCoreTests
        PRODUCT_MODULE_NAME: ScreenlogCoreTests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: ScreenlogCore
      - sdk: libsqlite3.tbd
    scheme:
      testTargets:
        - ScreenlogCoreTests

  ScreenlogAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ScreenlogAppTests
      # This target intentionally stays unhosted: these Foundation-only app
      # presentation sources can be tested without launching Screenlogger or
      # running any application lifecycle/bootstrap behavior.
      - path: Sources/ScreenlogApp/CaptureStatusPresentation.swift
      - path: Sources/ScreenlogApp/AppInstallLocation.swift
      - path: Sources/ScreenlogApp/CaptureOperationModels.swift
      - path: Sources/ScreenlogApp/AssistantOperationalReadinessPresentation.swift
      - path: Sources/ScreenlogApp/LibraryStartupIssue.swift
      - path: Sources/ScreenlogApp/LibrarySearchPagePresentation.swift
      - path: Sources/ScreenlogApp/Services/AssistantLiveVerification.swift
      - path: Sources/ScreenlogApp/Services/AssistantTestSearch.swift
      - path: Sources/ScreenlogApp/Services/BoundedLocalCommandRunner.swift
      - path: Sources/ScreenlogApp/Services/AgentPresence.swift
      - path: Sources/ScreenlogApp/Services/AssistantHandoffLaunchService.swift
      - path: Sources/ScreenlogApp/Services/CLICommandAvailability.swift
      - path: Sources/ScreenlogApp/Models/SettingsDestination.swift
      - path: Sources/ScreenlogApp/Models/SettingsWindowLayout.swift
      - path: Sources/ScreenlogApp/ExclusionPolicyPresentation.swift
      - path: Sources/ScreenlogApp/StorageConfidencePresentation.swift
      - path: Sources/ScreenlogApp/FirstRunValueProgress.swift
      - path: Sources/ScreenlogApp/SettingsRecoveryPresentation.swift
      - path: Sources/ScreenlogApp/TimelineNotice.swift
      - path: Sources/ScreenlogApp/TimelineDisplayPresentation.swift
      - path: Sources/ScreenlogApp/SLTimeFormat.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.app-tests
        PRODUCT_NAME: ScreenlogAppTests
        PRODUCT_MODULE_NAME: ScreenlogAppTests
        GENERATE_INFOPLIST_FILE: YES
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: ScreenlogCore
    scheme:
      testTargets:
        - ScreenlogAppTests

  ScreenlogAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/ScreenlogAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenlog.ui-tests
        PRODUCT_NAME: ScreenlogAppUITests
        PRODUCT_MODULE_NAME: ScreenlogAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScreenlogApp
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: ScreenlogApp

schemes:
  Screenlog:
    build:
      targets:
        ScreenlogCore: all
        ScreenlogApp: all
        ScreenlogCLI: all
        ScreenlogCoreTests: [test]
        ScreenlogAppTests: [test]
    test:
      targets:
        - ScreenlogCoreTests
        - ScreenlogAppTests
    run:
      config: Debug

  ScreenlogUI:
    build:
      targets:
        ScreenlogApp: all
        ScreenlogAppUITests: [test]
    test:
      targets:
        - ScreenlogAppUITests
    run:
      config: Debug
